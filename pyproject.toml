[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macshot"
version = "0.2.0"
description = "A macOS screenshot app that behaves like Cmd+Shift+4"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MacShot contributors" }]
keywords = ["macos", "screenshot", "screencapture", "tkinter"]
classifiers = [
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.scripts]
macshot = "macshot.__main__:main"

[tool.setuptools.packages.find]
include = ["macshot*"]
